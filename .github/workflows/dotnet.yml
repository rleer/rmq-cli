# Two test projects, and no more — see CLAUDE.md. Unit tests are pure functions and run
# everywhere; E2E tests drive the published native binary against a real broker in
# Testcontainers, which needs Docker and so runs on Linux only.

name: .NET

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  unit-tests:
    strategy:
      matrix:
        os: [ ubuntu-latest, windows-latest, macos-latest ]
      fail-fast: false

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Run Unit Tests
        run: dotnet test test/rmq.Unit.Tests/rmq.Unit.Tests.csproj --no-build --configuration Release --logger "trx;LogFileName=unit-tests.trx"

      - name: Upload Test Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-${{ matrix.os }}
          path: "**/*.trx"

  e2e-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore -c Release

      # The output path has to match Cli.ExecutablePath, which resolves
      # test/rmq.E2E.Tests/bin/rmq-published/rmq relative to the test assembly.
      #
      # Zero IL2xxx/IL3xxx is a non-negotiable and is only observable at publish
      # time, so it is gated here rather than compiled a second time to check.
      - name: Publish rmq native binary, failing on trim or AOT warnings
        run: |
          # pipefail is not on by default in a run block, and without it tee would
          # swallow a failed publish.
          set -eo pipefail
          dotnet publish src/rmq/rmq.csproj -c Release -r linux-x64 \
            -o test/rmq.E2E.Tests/bin/rmq-published 2>&1 | tee publish.log
          if grep -E "IL[0-9]{4}" publish.log; then
            echo "::error::publish produced IL2xxx/IL3xxx trim or AOT warnings"
            exit 1
          fi

      - name: Run E2E Tests
        run: dotnet test test/rmq.E2E.Tests/rmq.E2E.Tests.csproj --no-build -c Release --logger "trx;LogFileName=e2e-tests.trx"

      - name: Upload E2E Test Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-e2e
          path: "**/*.trx"

  test-report:
    if: always()
    needs: [ unit-tests, e2e-tests ]
    runs-on: ubuntu-latest
    permissions:
      checks: write
      pull-requests: write
    steps:
      - name: Download Test Results
        uses: actions/download-artifact@v4
        with:
          pattern: test-results-*
          path: test-results

      - name: Test Report
        uses: dorny/test-reporter@v1
        with:
          name: Test Results
          path: test-results/**/*.trx
          reporter: dotnet-trx
